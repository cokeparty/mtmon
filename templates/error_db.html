{% extends "base.html" %}
{% block title %}DB 연결 실패{% endblock %}

{% block content %}
<div class="section" style="max-width:560px;">
  <h3>DB 연결 실패</h3>
  <p style="font-size:13px;color:var(--ink);line-height:1.7;margin:4px 0 6px;">{{ message }}</p>
  <p style="font-size:12px;color:var(--muted);margin-bottom:12px;">
    잠시 후 다시 시도해 주세요. 계속되면 관리자에게 문의해 주세요.
  </p>
  <div><a class="btn btn-primary" href="javascript:location.reload()">다시 시도</a></div>
</div>
{% endblock %}
