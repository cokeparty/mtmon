{# templates/login.html #}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모니터링 시스템</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/monitor.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/img/monitor.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/img/monitor.png">
  <link rel="icon" type="image/x-icon" href="/static/img/monitor.png">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">

      <!-- ── 헤더 ── -->
      <div class="login-header">
        <div class="login-title">모니터링 시스템</div>
        <div class="login-subtitle">로그인</div>
      </div>
      <div class="login-body">

      <!-- ── 에러 메시지 ── -->
      {% if error %}
      <div class="error-box">
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- ── 로그인 폼 ── -->
      <form method="post" action="/login" id="login-form" autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="login_id">아이디</label>
          <input
            class="form-input"
            type="text"
            id="login_id"
            name="login_id"
            placeholder="아이디를 입력하세요"
            value="{{ login_id | default('') }}"
            autocomplete="username"
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">비밀번호</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn-login" id="btn-submit">
          로그인
        </button>

      </form>

      <hr class="divider">

      <!-- ── 역할 안내 ── -->
      <div class="role-guide">
        <span class="role-badge operator">운영자</span>
        <span class="role-badge developer">개발자</span>
        <span class="role-badge reviewer">검토자</span>
        <span class="role-badge viewer">조회자</span>
      </div>

      <div class="login-alt">
        계정이 없으신가요? <a href="/register">회원가입하기</a>
      </div>

      </div>
    </div>

    <!-- ── 하단 ── -->
    <div class="login-footer">
      © 월간 모니터링 통합 시스템 &nbsp;|&nbsp; 문의: 시스템 관리자
    </div>
  </div>

  <script>
    /* ── 폼 제출 시 버튼 로딩 상태 ── */
    document.getElementById('login-form').addEventListener('submit', function () {
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>로그인 중…';
    });

    /* ── Enter 키 → 폼 제출 ── */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        const active = document.activeElement;
        if (active && (active.id === 'login_id' || active.id === 'password')) {
          document.getElementById('login-form').requestSubmit();
        }
      }
    });
  </script>

</body>
</html>
