{% extends "base.html" %}
{% block title %}접근 권한 없음{% endblock %}

{% block content %}
<div class="section" style="max-width:520px;">
  <h3>접근 권한 없음</h3>
  <p style="font-size:13px;color:var(--ink);line-height:1.7;margin:4px 0 6px;">
    {{ message or "이 페이지에 접근하려면 운영자(operator) 권한이 필요합니다." }}
  </p>
  <p style="font-size:12px;color:var(--muted);margin-bottom:12px;">
    다른 역할이 필요하면 시스템 관리자에게 문의해 주세요.
  </p>
  <div><a class="btn btn-primary" href="/">대시보드로 돌아가기</a></div>
</div>
{% endblock %}
