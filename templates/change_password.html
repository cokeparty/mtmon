{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}

{% block content %}
<div class="section" style="max-width:440px;">
  <h3>비밀번호 변경</h3>

  {% if success %}<div class="alert-ok">{{ success }}</div>{% endif %}
  {% if error %}<div class="alert-bad">{{ error }}</div>{% endif %}

  <form method="post" action="/change-password" class="pw-form">
    <label>현재 비밀번호
      <input type="password" name="current_password" required autofocus>
    </label>
    <label>새 비밀번호 <span class="hint">8자 이상</span>
      <input type="password" name="new_password" required minlength="8">
    </label>
    <label>새 비밀번호 확인
      <input type="password" name="new_password_confirm" required>
    </label>
    <div style="display:flex;justify-content:flex-end;">
      <button type="submit" class="btn btn-primary">비밀번호 변경</button>
    </div>
  </form>
</div>
{% endblock %}

{% block styles %}
<style>
  .pw-form { display: flex; flex-direction: column; gap: 10px; }
  .pw-form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .pw-form .hint { font-weight: 400; color: var(--muted); }
  .pw-form input { width: 100%; }
</style>
{% endblock %}
