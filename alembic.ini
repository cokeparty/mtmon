# DB migration settings (ASCII only: Windows reads this file with the locale codepage)
#  - DB URL comes from .env DATABASE_URL (not written here)
#  - Applied automatically at app start (AUTO_MIGRATE=true). Manual commands:
#      python -m alembic upgrade head
#      python -m alembic current
#      python -m alembic revision --autogenerate -m "message"
[alembic]
script_location = migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
